<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifta's Expenses Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Space Mono', monospace;
            background: #f1eef7;
            color: #2B2438;
            max-width: 400px;
            width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            padding: 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            animation: fadeIn 0.7s ease-in forwards;
        }

        @media (max-width: 480px) {
            body {
                margin: 0 auto;
                min-height: 100vh;
                max-width: 100%;
                border-radius: 0;
                border: none;
                padding: 24px 20px;
                box-shadow: none;
            }
        }

        @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7C5CBF;
        }

        select, input, datalist {
            width: 100%;
            padding: 12px;
            margin-top: 2px;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            text-align: left;
            color: #2B2438;
            background: #f4f2f7;
            border: 1.5px solid #E4DBF5;
            border-radius: 8px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        datalist option {
            color: #2B2438;
            background: #f4f2f7;
            padding: 8px 12px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #7C5CBF;
            box-shadow: 0 0 0 3px rgba(124, 92, 191, 0.15);
        }

        input::-webkit-date-and-time-value {
            text-align: left;
        }

        #note {
            font-size: 90%;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        button:active { transform: scale(0.98); }

        button:disabled {
            background-color: #D8D2E6 !important;
            color: #afa1d3 !important;
            cursor: not-allowed;
            transform: none;
        }

        #submitBtn, #authButton {
            background-color: #7C5CBF;
            color: #FFFFFF;
        }

        #submitBtn:hover:not(:disabled), #authButton:hover:not(:disabled) {
            background-color: #5B21B6;
        }

        #resetBtn {
            background-color: #f4f2f7;
            color: #7C5CBF;
            border: 1.5px solid #E4DBF5;
        }

        #resetBtn:hover {
            background-color: #ffffff;
            border-color: #7C5CBF;
        }

        /* Spinner shown inline inside a button's own label while busy */
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #balanceDisplay {
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            margin-top: 24px;
            display: none;
            font-weight: 700;
            text-align: center;
            color: #4C1D95;
            padding: 14px;
            background: #EDE7F6;
            border-radius: 8px;
        }

        #balanceValidation {
            display: none;
            margin-top: 12px;
            padding: 14px;
            border: 1.5px solid #E4DBF5;
            border-radius: 8px;
            background: #ffffff;
        }

        #balanceValidation p {
            margin: 0 0 10px;
            font-size: 12px;
            line-height: 1.5;
            text-align: center;
        }

        .validation-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .validation-actions button {
            margin-top: 0;
            padding: 10px;
            font-size: 12px;
        }

        #confirmBalanceBtn {
            background-color: #2F7D5A;
            color: #FFFFFF;
        }

        #confirmBalanceBtn:hover:not(:disabled) {
            background-color: #246446;
        }

        #rejectBalanceBtn {
            background-color: #f4f2f7;
            color: #7C5CBF;
            border: 1.5px solid #E4DBF5;
        }

        #validationStatus {
            display: none;
            margin: 10px 0 0;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
            font-style: italic;
        }

        #validationStatus.success { color: #2F7D5A; }
        #validationStatus.error { color: #B0233F; }

        .loading-text { color: #9C93B3; font-style: italic; }

        #authGate,
        #app {
            width: 100%;
        }

        #app { display: none; }

        #authError {
            display: none;
            color: #B0233F;
            margin-top: 10px;
            font-size: 13px;
            font-style: italic;
            min-height: 16px;
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body>

    <section id="authGate">
        <form id="authForm">
            <div class="form-group">
                <label for="apiKey">Password</label>
                <input type="password" id="apiKey" autocomplete="current-password" required>
            </div>
            <button type="submit" id="authButton">Unlock</button>
            <div id="authError" role="alert"></div>
        </form>
    </section>

    <main id="app">

    <!-- Dynamic Type Selection -->
    <div class="form-group">
        <label for="type">Transaction Type</label>
        <select id="type">
            <option class="loading-text">Loading types...</option>
        </select>
    </div>

    <!-- Transaction Date -->
    <div class="form-group">
        <label for="transactionDate">Date</label>
        <input type="date" id="transactionDate" required>
    </div>

    <!-- Dynamic Expense Category Selection -->
    <div class="form-group">
        <label for="expenseCategory">Category</label>
        <input type="text" id="expenseCategory" list="categoryList" placeholder="Type or select...">
        <datalist id="categoryList"></datalist>
    </div>

    <!-- Dynamic Wallet Selection -->
    <div class="form-group">
        <label for="wallet">Wallet Source / Destination</label>
        <input type="text" id="wallet" list="walletList" placeholder="Type or select...">
        <datalist id="walletList"></datalist>
    </div>

    <!-- Amount -->
    <div class="form-group">
        <label for="amount">Amount</label>
        <input type="text" id="amount" placeholder="Rp0" min="0" step="100000" required>
    </div>

    <!-- Note (Description) -->
    <div class="form-group">
        <label for="note">Note</label>
        <input
            type="text"
            id="note"
            placeholder="Description" required>
    </div>

    <!-- Wallet Balance Output -->
    <div id="balanceDisplay">Current Balance: Fetching...</div>

    <!-- Balance Validation -->
    <section id="balanceValidation" aria-labelledby="validationPrompt">
        <p id="validationPrompt">Is this balance correct?</p>
        <div class="validation-actions">
            <button type="button" id="confirmBalanceBtn" onclick="validateBalance(true)">Yes</button>
            <button type="button" id="rejectBalanceBtn" onclick="validateBalance(false)">No</button>
        </div>
        <p id="validationStatus" role="status"></p>
    </section>

    <!-- Submit Button -->
    <button id="submitBtn" onclick="sendTransaction()" disabled>Loading Sheet Configuration...</button>
    <button type="button" id="resetBtn" onclick="resetTransactionForm()">Reset</button>
    
    </main>

    <script>
        // Replace with your copied Google Apps Script Web App URL
        const webAppUrl = "WEB_APP_URL";
        let apiKey = "";

        function formatBalance(value) {
            const amount = Number(value);
            return Number.isFinite(amount)
                ? `Rp${new Intl.NumberFormat("id-ID").format(amount)}`
                : "Balance unavailable";
        }

        function getToday() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");
            return `${today.getFullYear()}-${month}-${day}`;
        }

        function resetTransactionForm() {
            document.getElementById("transactionDate").value = getToday();
            document.getElementById("amount").value = "";
            document.getElementById("note").value = "";
            document.getElementById("balanceDisplay").style.display = "none";
            document.getElementById("balanceValidation").style.display = "none";
            setValidationStatus("");
        }

        function setValidationStatus(message, statusClass = "") {
            const status = document.getElementById("validationStatus");
            status.innerText = message;
            status.className = statusClass;
            status.style.display = message ? "block" : "none";
        }

        resetTransactionForm();

        // 1. LOAD CATEGORIES AFTER AUTHENTICATION
        async function loadApp() {
            const authGate = document.getElementById("authGate");
            const app = document.getElementById("app");
            const authError = document.getElementById("authError");
            const authButton = document.getElementById("authButton");

            authButton.disabled = true;
            authButton.innerHTML = '<span class="btn-spinner"></span>Checking...';
            authError.innerText = "";

            try {
                const requestUrl = `${webAppUrl}?apiKey=${encodeURIComponent(apiKey)}`;
                const response = await fetch(requestUrl);
                const data = await response.json();
                
                if (!response.ok || data.error) {
                    throw new Error(data.error || "Authentication failed.");
                }

                authGate.style.display = "none";
                app.style.display = "block";

                // Populate Type Dropdown
                const typeSelect = document.getElementById("type");
                typeSelect.innerHTML = "";
                data.types.toReversed().forEach(t => {
                    typeSelect.options[typeSelect.options.length] = new Option(t, t);
                }); // Expenses as default

                const categoryGroup =
                    document.getElementById("expenseCategory").parentElement;

                function updateCategoryVisibility() {
                    if (typeSelect.value === "Allowances") {
                        categoryGroup.style.display = "none";
                    } else {
                        categoryGroup.style.display = "block";
                                
                        // Populate Expense Category Datalist
                        const categoryList = document.getElementById("categoryList");
                        categoryList.innerHTML = "";
                        
                        // Add blank option
                        const blankOption = document.createElement("option");
                        blankOption.value = "";
                        blankOption.text = "Unselected";
                        categoryList.appendChild(blankOption);

                        data.expenseCategory.forEach(c => {
                            const option = document.createElement("option");
                            option.value = c;
                            option.text = c;
                            categoryList.appendChild(option);
                        });
                    }
                }

                typeSelect.addEventListener("change", updateCategoryVisibility);
                updateCategoryVisibility();

                // Populate Wallet Datalist
                const walletList = document.getElementById("walletList");
                walletList.innerHTML = "";
                
                // Add blank option
                const blankWalletOption = document.createElement("option");
                blankWalletOption.value = "";
                blankWalletOption.text = "Unselected";
                walletList.appendChild(blankWalletOption);
                
                data.wallets.forEach(w => {
                    const option = document.createElement("option");
                    option.value = w;
                    option.text = w;
                    walletList.appendChild(option);
                });

                // Set initial balance display
                const balanceDisplay = document.getElementById("balanceDisplay");
                balanceDisplay.innerText =
                    `Current Balance: ${formatBalance(data.balance)}`;
                balanceDisplay.style.display = "block";
                document.getElementById("balanceValidation").style.display = "block";
                setValidationStatus("");
                
                // Enable Submit Button
                const submitBtn = document.getElementById("submitBtn");
                submitBtn.innerText = "Submit Transaction";
                submitBtn.disabled = false;

            } catch (error) {
                console.error("Initialization error:", error);
                authError.innerText = error.message;
                authError.style.display = "block";
                apiKey = "";
                document.getElementById("apiKey").value = "";
            } finally {
                authButton.disabled = false;
                authButton.innerText = "Unlock";
            }
        }

        document.getElementById("authForm").addEventListener("submit", function(event) {
            event.preventDefault();
            apiKey = document.getElementById("apiKey").value;
            loadApp();
        });

        // 2. VALIDATE THE CURRENT BALANCE
        async function validateBalance(isCorrect) {
            const confirmButton = document.getElementById("confirmBalanceBtn");
            const rejectButton = document.getElementById("rejectBalanceBtn");

            if (!isCorrect) {
                setValidationStatus("Balance not confirmed. Add a transaction or refresh to check again.");
                return;
            }

            confirmButton.disabled = true;
            rejectButton.disabled = true;
            confirmButton.innerHTML = '<span class="btn-spinner"></span>Saving...';
            setValidationStatus("");

            try {
                const response = await fetch(webAppUrl, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        apiKey,
                        action: "validateBalance",
                        validation: "yes",
                        "trakhir check": getToday()
                    })
                });

                const result = await response.json();
                if (result.status !== "success") {
                    throw new Error(result.message || "Failed to save validation.");
                }

                setValidationStatus(`Balance confirmed on ${getToday()}.`, "success");
            } catch (error) {
                setValidationStatus(error.message, "error");
            } finally {
                confirmButton.disabled = false;
                rejectButton.disabled = false;
                confirmButton.innerText = "Yes";
            }
        }

        // 3. SEND THE TRANSACTION
        async function sendTransaction() {
            const submitBtn = document.getElementById("submitBtn");
            const balanceDisplay = document.getElementById("balanceDisplay");

            const amountValue = document.getElementById("amount").value.trim();
            const payload = {
                apiKey,
                date: document.getElementById("transactionDate").value,
                type: document.getElementById("type").value,
                wallet: document.getElementById("wallet").value,
                note: document.getElementById("note").value,
                amount: amountValue.startsWith("=") ? amountValue : Number(amountValue)
            };

            if (payload.type === "Expenses") {
                payload.expenseCategory =
                    document.getElementById("expenseCategory").value;
            }


            if (!payload.date) {
                alert("Please select a date.");
                return;
            }

            if (!payload.amount || (typeof payload.amount === "number" && payload.amount <= 0)) {
                alert("Please enter a valid amount.");
                return;
            }

            const originalLabel = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-spinner"></span>Saving...';

            try {
                const response = await fetch(webAppUrl, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === "success") {
                    balanceDisplay.style.display = "block";
                    balanceDisplay.innerText =
                        `Current Balance: ${formatBalance(result.balance)}`;
                    document.getElementById("balanceValidation").style.display = "block";
                    setValidationStatus("");
                    document.getElementById("amount").value = "";
                    document.getElementById("note").value = "";
                } else {
                    throw new Error(result.message || "Failed to save data.");
                }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalLabel;
            }
        }
    </script>
</body>
</html>
