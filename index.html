<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gifta's Expenses Tracker</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');

        * { box-sizing: border-box; }

        body {
            font-family: 'Space Mono', monospace;
            background: #f1eef7;
            color: #2B2438;
            max-width: 400px;
            width: 100%;
            min-height: 100vh;
            margin: 0 auto;
            padding: 32px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            animation: fadeIn 0.7s ease-in forwards;
        }

        @media (max-width: 480px) {
            body {
                margin: 0 auto;
                min-height: 100vh;
                max-width: 100%;
                border-radius: 0;
                border: none;
                padding: 24px 20px;
                box-shadow: none;
            }
        }

        @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7C5CBF;
        }

        select, input, datalist {
            width: 100%;
            padding: 12px;
            margin-top: 2px;
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            text-align: left;
            color: #2B2438;
            background: #f4f2f7;
            border: 1.5px solid #E4DBF5;
            border-radius: 8px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            -webkit-appearance: none;
            appearance: none;
        }

        datalist option {
            color: #2B2438;
            background: #f4f2f7;
            padding: 8px 12px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #7C5CBF;
            box-shadow: 0 0 0 3px rgba(124, 92, 191, 0.15);
        }

        input::-webkit-date-and-time-value {
            text-align: left;
        }

        #note {
            font-size: 11px;
        }

        .date-input-wrapper {
            position: relative;
        }

        #transactionDateValue {
            position: absolute;
            inset: 2px 0 0;
            width: 100%;
            height: calc(100% - 2px);
            opacity: 0;
            cursor: pointer;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            #transactionDateValue {
                pointer-events: auto;
                z-index: 1;
            }
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.15s ease, transform 0.1s ease;
        }

        button:active { transform: scale(0.98); }

        button:disabled {
            background-color: #D8D2E6 !important;
            color: #afa1d3 !important;
            cursor: not-allowed;
            transform: none;
        }

        #submitBtn, #authButton {
            background-color: #7C5CBF;
            color: #FFFFFF;
        }

        #submitBtn:hover:not(:disabled), #authButton:hover:not(:disabled) {
            background-color: #5B21B6;
        }

        #resetBtn {
            background-color: #f4f2f7;
            color: #7C5CBF;
            border: 1.5px solid #E4DBF5;
        }

        #resetBtn:hover {
            background-color: #ffffff;
            border-color: #7C5CBF;
        }

        /* Spinner shown inline inside a button's own label while busy */
        .btn-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            vertical-align: middle;
            margin-right: 8px;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #balanceDisplay {
            font-family: 'Space Mono', monospace;
            font-size: 14px;
            margin: 0;
            display: none;
            font-weight: 700;
            text-align: center;
            color: #4C1D95;
            padding: 0 0 14px;
            background: #EDE7F6;
            border-radius: 8px;
        }

        #balanceValidation {
            display: none;
            margin: 24px 0;
            padding: 14px;
            border: 1.5px solid #E4DBF5;
            border-radius: 8px;
            background: #EDE7F6;
        }

        .validation-actions {
            display: block;
        }

        .validation-actions button {
            margin-top: 0;
            padding: 10px;
            font-size: 12px;
        }

        #confirmBalanceBtn {
            background-color: #2F7D5A;
            color: #FFFFFF;
        }

        #confirmBalanceBtn:hover:not(:disabled) {
            background-color: #24644667;
        }

        #validationStatus {
            display: none;
            margin: 10px 0 0;
            font-size: 11px;
            line-height: 1.5;
            text-align: center;
            font-style: italic;
        }

        #validationStatus.success { color: #2F7D5A; }
        #validationStatus.error { color: #B0233F; }

        .loading-text { color: #9C93B3; font-style: italic; }

        #authGate,
        #app {
            width: 100%;
        }

        #app { display: none; }

        #authError {
            display: none;
            color: #B0233F;
            margin-top: 10px;
            font-size: 11px;
            font-style: italic;
            min-height: 16px;
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body>

    <section id="authGate">
        <form id="authForm">
            <div class="form-group">
                <label for="apiKey">Password</label>
                <input type="password" id="apiKey" autocomplete="current-password" required>
            </div>
            <button type="submit" id="authButton">Unlock</button>
            <div id="authError" role="alert"></div>
        </form>
    </section>

    <main id="app">

    <!-- Dynamic Type Selection -->
    <div class="form-group">
        <label for="type">Transaction Type</label>
        <select id="type">
            <option class="loading-text">Loading types...</option>
        </select>
    </div>

    <!-- Transaction Date -->
    <div class="form-group">
        <label for="transactionDate">Date</label>
        <div class="date-input-wrapper">
            <input type="text" id="transactionDate" placeholder="dd MMM yyyy" autocomplete="off" readonly required>
            <input type="date" id="transactionDateValue" aria-label="Choose transaction date">
        </div>
    </div>

    <!-- Dynamic Expense Category Selection -->
    <div class="form-group">
        <label for="expenseCategory">Category</label>
        <input type="text" id="expenseCategory" list="categoryList" placeholder="Type or select...">
        <datalist id="categoryList"></datalist>
    </div>

    <!-- Dynamic Wallet Selection -->
    <div class="form-group">
        <label for="wallet">Wallet Source / Destination</label>
        <input type="text" id="wallet" list="walletList" placeholder="Type or select...">
        <datalist id="walletList"></datalist>
    </div>

    <!-- Balance Validation -->
    <section id="balanceValidation">
        <div id="balanceDisplay">Current Balance: Fetching...</div>
        <div class="validation-actions">
            <button type="button" id="confirmBalanceBtn" onclick="validateBalance()">Update last check</button>
        </div>
        <p id="validationStatus" role="status"></p>
    </section>

    <!-- Amount -->
    <div class="form-group">
        <label for="amount">Amount</label>
        <input type="text" id="amount" placeholder="Rp0" min="0" step="100000" required>
    </div>

    <!-- Note (Description) -->
    <div class="form-group">
        <label for="note">Note</label>
        <input
            type="text"
            id="note"
            placeholder="" required>
    </div>

    <!-- Submit Button -->
    <button id="submitBtn" onclick="sendTransaction()" disabled>Loading Sheet Configuration...</button>
    <button type="button" id="resetBtn" onclick="resetTransactionForm()">Reset</button>
    
    </main>

    <script>
        // Replace with your copied Google Apps Script Web App URL
        const webAppUrl = "WEB_APP_URL";
        let apiKey = "";
        let selectedWalletRow = "";
        let balanceRequestId = 0;

        function formatBalance(value) {
            const amount = Number(value);
            return Number.isFinite(amount)
                ? `Rp${new Intl.NumberFormat("id-ID").format(amount)}`
                : "Balance unavailable";
        }

        function getToday() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, "0");
            const day = String(today.getDate()).padStart(2, "0");
            return `${today.getFullYear()}-${month}-${day}`;
        }

        function formatDateForDisplay(isoDate) {
            const [year, month, day] = isoDate.split("-");
            const monthName = new Intl.DateTimeFormat("en", { month: "short" })
                .format(new Date(Number(year), Number(month) - 1, 1));
            return `${day} ${monthName} ${year}`;
        }

        function setTransactionDate(isoDate) {
            document.getElementById("transactionDateValue").value = isoDate;
            document.getElementById("transactionDate").value = formatDateForDisplay(isoDate);
        }

        function resetTransactionForm() {
            setTransactionDate(getToday());
            document.getElementById("amount").value = "";
            document.getElementById("note").value = "";
            document.getElementById("balanceDisplay").style.display = "none";
            document.getElementById("balanceValidation").style.display = "none";
            setValidationStatus("");
        }

        function setValidationStatus(message, statusClass = "") {
            const status = document.getElementById("validationStatus");
            status.innerText = message;
            status.className = statusClass;
            status.style.display = message ? "block" : "none";
        }

        function showBalance(balance) {
            const balanceDisplay = document.getElementById("balanceDisplay");
            const balanceValidation = document.getElementById("balanceValidation");

            balanceDisplay.innerText = `Current Balance: ${formatBalance(balance)}`;
            balanceDisplay.style.display = Number.isFinite(Number(balance)) ? "block" : "none";
            balanceValidation.style.display = Number.isFinite(Number(balance)) ? "block" : "none";
            setValidationStatus("");
        }

        function getSelectedWalletRow() {
            const walletInput = document.getElementById("wallet");
            const walletOption = document.querySelector(
                `#walletList option[value="${CSS.escape(walletInput.value)}"]`
            );
            return walletOption?.dataset.row || "";
        }

        async function loadWalletBalance(walletRow) {
            const requestId = ++balanceRequestId;
            selectedWalletRow = walletRow || "";
            setValidationStatus("");

            if (!walletRow) {
                showBalance(null);
                return;
            }

            const balanceDisplay = document.getElementById("balanceDisplay");
            balanceDisplay.innerText = "Current Balance: Fetching...";
            balanceDisplay.style.display = "block";
            document.getElementById("balanceValidation").style.display = "block";

            try {
                const response = await fetch(webAppUrl, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        apiKey,
                        action: "getBalance",
                        walletRow
                    })
                });
                const data = await response.json();

                if (requestId !== balanceRequestId) {
                    return;
                }
                if (!response.ok || data.error) {
                    throw new Error(data.error || "Unable to load wallet balance.");
                }

                showBalance(data.balance);
            } catch (error) {
                if (requestId !== balanceRequestId) {
                    return;
                }
                showBalance(null);
                setValidationStatus(error.message, "error");
            }
        }

        resetTransactionForm();

        // 1. LOAD CATEGORIES AFTER AUTHENTICATION
        async function loadApp() {
            const authGate = document.getElementById("authGate");
            const app = document.getElementById("app");
            const authError = document.getElementById("authError");
            const authButton = document.getElementById("authButton");

            authButton.disabled = true;
            authButton.innerHTML = '<span class="btn-spinner"></span>Checking...';
            authError.innerText = "";

            try {
                const response = await fetch(webAppUrl, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        apiKey,
                        action: "initialize"
                    })
                });
                const data = await response.json();
                
                if (!response.ok || data.error || data.status === "error") {
                    throw new Error(data.error || data.message || "Authentication failed.");
                }

                if (!Array.isArray(data.types) ||
                    !Array.isArray(data.wallets) ||
                    !Array.isArray(data.expenseCategory)) {
                    throw new Error("The backend did not return initialization data. Redeploy the Apps Script with the initialize action enabled.");
                }

                authGate.style.display = "none";
                app.style.display = "block";

                // Populate Type Dropdown
                const typeSelect = document.getElementById("type");
                typeSelect.innerHTML = "";
                data.types.slice().reverse().forEach(t => {
                    typeSelect.options[typeSelect.options.length] = new Option(t, t);
                }); // Expenses as default

                const categoryGroup =
                    document.getElementById("expenseCategory").parentElement;

                function updateCategoryVisibility() {
                    if (typeSelect.value === "Allowances") {
                        categoryGroup.style.display = "none";
                    } else {
                        categoryGroup.style.display = "block";
                                
                        // Populate Expense Category Datalist
                        const categoryList = document.getElementById("categoryList");
                        categoryList.innerHTML = "";
                        
                        // Add blank option
                        const blankOption = document.createElement("option");
                        blankOption.value = "";
                        blankOption.text = "Unselected";
                        categoryList.appendChild(blankOption);

                        data.expenseCategory.forEach(c => {
                            const option = document.createElement("option");
                            option.value = c;
                            option.text = c;
                            categoryList.appendChild(option);
                        });
                    }
                }

                typeSelect.addEventListener("change", updateCategoryVisibility);
                updateCategoryVisibility();

                // Populate Wallet Datalist
                const walletList = document.getElementById("walletList");
                walletList.innerHTML = "";
                
                // Add blank option
                const blankWalletOption = document.createElement("option");
                blankWalletOption.value = "";
                blankWalletOption.text = "Unselected";
                walletList.appendChild(blankWalletOption);
                
                data.wallets.forEach((wallet, index) => {
                    const walletName = typeof wallet === "object"
                        ? (wallet.name || wallet.wallet || wallet.value)
                        : wallet;
                    const walletRow = typeof wallet === "object"
                        ? (wallet.row || wallet.walletRow)
                        : data.walletRows?.[index];
                    const option = document.createElement("option");
                    option.value = walletName;
                    option.text = walletName;
                    option.dataset.row = walletRow || "";
                    walletList.appendChild(option);
                });

                const walletInput = document.getElementById("wallet");
                const updateWalletBalance = () => {
                    loadWalletBalance(getSelectedWalletRow());
                };
                walletInput.addEventListener("input", updateWalletBalance);
                walletInput.addEventListener("change", updateWalletBalance);

                showBalance(null);
                
                // Enable Submit Button
                const submitBtn = document.getElementById("submitBtn");
                submitBtn.innerText = "Submit Transaction";
                submitBtn.disabled = false;

            } catch (error) {
                console.error("Initialization error:", error);
                authError.innerText = error.message;
                authError.style.display = "block";
                apiKey = "";
                document.getElementById("apiKey").value = "";
            } finally {
                authButton.disabled = false;
                authButton.innerText = "Unlock";
            }
        }

        document.getElementById("authForm").addEventListener("submit", function(event) {
            event.preventDefault();
            apiKey = document.getElementById("apiKey").value;
            loadApp();
        });

        document.getElementById("transactionDateValue").addEventListener("change", function(event) {
            setTransactionDate(event.target.value);
        });

        document.getElementById("transactionDate").addEventListener("click", function() {
            const datePicker = document.getElementById("transactionDateValue");
            if (typeof datePicker.showPicker === "function") {
                datePicker.showPicker();
            } else {
                datePicker.click();
            }
        });

        document.getElementById("amount").addEventListener("keydown", function(event) {
            if (event.key === "Enter" || event.key === "ArrowDown") {
                event.preventDefault();
                document.getElementById("note").focus();
                document.getElementById("note").select();
            }
        });

        // Add Enter key support for transaction submission
        document.getElementById("note").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendTransaction();
            }
        });

        // 2. VALIDATE THE CURRENT BALANCE
        async function validateBalance() {
            const confirmButton = document.getElementById("confirmBalanceBtn");
            const walletRow = getSelectedWalletRow();

            if (!walletRow) {
                setValidationStatus("Select a wallet before confirming the balance.", "error");
                return;
            }

            confirmButton.disabled = true;
            confirmButton.innerHTML = '<span class="btn-spinner"></span>Saving...';
            setValidationStatus("");

            try {
                const response = await fetch(webAppUrl, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        apiKey,
                        action: "confirmBalance",
                        walletRow
                    })
                });

                const result = await response.json();
                if (result.status !== "success") {
                    throw new Error(result.message || "Failed to save validation.");
                }

                setValidationStatus(`Balance confirmed on ${getToday()}.`, "success");
            } catch (error) {
                setValidationStatus(error.message, "error");
            } finally {
                confirmButton.disabled = false;
                confirmButton.innerText = "Update last check";
            }
        }

        // 3. SEND THE TRANSACTION
        async function sendTransaction() {
            const submitBtn = document.getElementById("submitBtn");
            const balanceDisplay = document.getElementById("balanceDisplay");
            selectedWalletRow = getSelectedWalletRow();

            const amountValue = document.getElementById("amount").value.trim();
            const arithmeticFormulaPattern = /^=\s*[0-9\s()+\-*/%.]+$/;
            if (amountValue.startsWith("=") && !arithmeticFormulaPattern.test(amountValue)) {
                alert("Only basic arithmetic formulas are allowed.");
                return;
            }

            const payload = {
                apiKey,
                date: document.getElementById("transactionDateValue").value,
                type: document.getElementById("type").value,
                wallet: document.getElementById("wallet").value,
                note: document.getElementById("note").value,
                amount: amountValue.startsWith("=") ? amountValue : Number(amountValue)
            };

            if (payload.type === "Expenses") {
                payload.expenseCategory =
                    document.getElementById("expenseCategory").value;
            }


            if (!payload.date) {
                alert("Please select a date.");
                return;
            }

            if (!payload.amount || (typeof payload.amount === "number" && payload.amount <= 0)) {
                alert("Please enter a valid amount.");
                return;
            }

            const originalLabel = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="btn-spinner"></span>Saving...';

            try {
                const response = await fetch(webAppUrl, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();

                if (result.status === "success") {
                    showBalance(result.balance);
                    document.getElementById("amount").value = "";
                    document.getElementById("note").value = "";
                } else {
                    throw new Error(result.message || "Failed to save data.");
                }
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalLabel;
            }
        }
    </script>
</body>
</html>
